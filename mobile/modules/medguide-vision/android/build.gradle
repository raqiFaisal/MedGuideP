plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.medguidevision'
version = '0.1.0'

android {
  namespace "expo.modules.medguidevision"
}

repositories {
  exclusiveContent {
    forRepository { mavenCentral() }
    filter {
      includeModule('org.opencv', 'opencv')
    }
  }
}

dependencies {
  implementation 'org.opencv:opencv:4.12.0'
}
